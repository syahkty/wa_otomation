<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Catatan Hutang</title>
  <style>
    :root{
      --bg:#0c0f14; --card:#12161d; --muted:#9aa4b2; --line:#1f2630;
      --accent:#7c5cff; --danger:#ef4444; --success:#22c55e;
      --radius:18px; --shadow:0 10px 40px rgba(0,0,0,.35);
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;
      color:#e5e7eb; background:
        radial-gradient(1200px 600px at -20% -20%, rgba(124,92,255,.12), transparent 60%),
        radial-gradient(900px 500px at 120% 20%, rgba(34,197,94,.10), transparent 50%),
        var(--bg);
      padding:24px;
    }
    .wrap{max-width:980px; margin:0 auto; display:grid; gap:18px}
    /* HEADER STATUS */
    .status{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.015)),var(--card);
      border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:22px 20px}
    .row{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
    .pill{display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:999px;
      background:rgba(124,92,255,.12); border:1px solid rgba(124,92,255,.25); font-weight:700}
    .amount{margin-left:auto; font-size:28px; font-weight:900;
      background:linear-gradient(90deg,#fff,#c7c9ff); -webkit-background-clip:text; color:transparent}
    .sub{color:var(--muted); font-size:13px; margin-top:6px}
    .pair{display:flex; align-items:center; gap:10px; margin-top:12px}
    .avatar{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);display:grid;place-content:center;
      font-weight:800;background:#0d1117;color:#cbd5e1}
    .arrow{flex:0 0 48px;height:2px;background:linear-gradient(90deg,var(--line),#444cf7);position:relative}
    .arrow::after{content:"";position:absolute;right:-6px;top:-3px;width:0;height:0;
      border-left:8px solid #444cf7;border-top:5px solid transparent;border-bottom:5px solid transparent}

    /* LIST KOLOM */
    .lanes{display:grid; grid-template-columns:repeat(2,1fr); gap:18px}
    @media (max-width:780px){ .lanes{grid-template-columns:1fr} }
    .card{background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,.01)),var(--card);
      border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden}
    .card h3{margin:0; padding:14px 16px; border-bottom:1px solid var(--line); font-size:14px; letter-spacing:.3px; text-transform:uppercase; color:#cfd5e3}
    .list{list-style:none; margin:0; padding:8px 12px}
    .item{display:flex; gap:12px; align-items:flex-start; padding:10px 8px; border-bottom:1px dashed #1e2530}
    .item:last-child{border-bottom:none}
    .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;box-shadow:0 0 0 4px rgba(255,255,255,.02)}
    .dot.red{background:var(--danger)}   /* event dari Misba → +balance */
    .dot.green{background:var(--success)}/* event dari Sakti → -balance */
    .meta{font-size:12px;color:var(--muted)}
    .amt{font-weight:800}
    .muted{color:var(--muted); text-align:center; padding:18px 8px}
    .foot{color:var(--muted); text-align:center; font-size:12px}
  </style>
</head>
<body>
  <div class="wrap">
    <!-- STATUS -->
    <section class="status">
      <div class="row">
        <div class="pill" id="who">Memuat status…</div>
        <div class="amount" id="amount">—</div>
      </div>
      <div class="sub" id="subtitle">Menunggu data dari API…</div>
      <div class="pair" id="pair"></div>
    </section>

    <!-- HISTORI DUA LAJUR -->
    <section class="lanes">
      <article class="card">
        <h3>Dibayar oleh MISBA</h3>
        <ul class="list" id="lane-misba"></ul>
      </article>
      <article class="card">
        <h3>Dibayar oleh SAKTI</h3>
        <ul class="list" id="lane-sakti"></ul>
      </article>
    </section>

    <div class="foot" id="updated">—</div>
  </div>

  <script>
    const API_URL = '/api/hutang';

    const el = {
      who: document.getElementById('who'),
      amount: document.getElementById('amount'),
      subtitle: document.getElementById('subtitle'),
      pair: document.getElementById('pair'),
      laneMisba: document.getElementById('lane-misba'),
      laneSakti: document.getElementById('lane-sakti'),
      updated: document.getElementById('updated')
    };

    const money = n => new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',minimumFractionDigits:0}).format(n);
    const when  = s => new Date(s).toLocaleString('id-ID');

    function avatar(name){
      const a=document.createElement('div'); a.className='avatar'; a.textContent=name[0].toUpperCase(); return a;
    }

    function renderStatus(data){
      if(!data || data.length===0){
        el.who.textContent='Lunas';
        el.amount.textContent=money(0);
        el.subtitle.textContent='Tidak ada hutang yang berjalan.';
        el.pair.innerHTML='';
        return;
      }
      const d=data[0];
      const debtor=(d.nomor||'').toLowerCase();          // 'sakti' | 'misba'
      const creditor=debtor==='sakti'?'misba':'sakti';
      const total=Math.abs(d.totalHutang||0);

      el.who.textContent=`${debtor[0].toUpperCase()+debtor.slice(1)} Berhutang`;
      el.amount.textContent=money(total);
      el.subtitle.textContent=`Kepada ${creditor[0].toUpperCase()+creditor.slice(1)} — otomatis timbal-balik`;

      el.pair.innerHTML='';
      const a=avatar(debtor), arr=document.createElement('div'), c=avatar(creditor);
      arr.className='arrow'; el.pair.append(a,arr,c);
    }

    function itemHTML(t, color){
      const whenText=when(t.tanggal);
      return `
        <div class="dot ${color}"></div>
        <div>
          <div><span class="amt">${money(t.jumlah)}</span></div>
          <div class="meta">${t.keterangan||'-'} • ${whenText}</div>
        </div>`;
    }

    function renderLanes(data){
      el.laneMisba.innerHTML=''; el.laneSakti.innerHTML='';
      if(!data || data.length===0){
        el.laneMisba.innerHTML=`<li class="muted">Belum ada transaksi</li>`;
        el.laneSakti.innerHTML=`<li class="muted">Belum ada transaksi</li>`;
        return;
      }
      const tx=(data[0].transaksi||[]).slice().reverse(); // terbaru di atas
      // dari backend: t.jenis === 'hutang' (dibayar MISBA, +balance) | 'bayar' (dibayar SAKTI, -balance)
      const left = tx.filter(t=>t.jenis==='hutang');
      const right= tx.filter(t=>t.jenis==='bayar');

      if(left.length===0)  el.laneMisba.innerHTML=`<li class="muted">—</li>`;
      if(right.length===0) el.laneSakti.innerHTML=`<li class="muted">—</li>`;

      left.forEach(t=>{ const li=document.createElement('li'); li.className='item'; li.innerHTML=itemHTML(t,'red'); el.laneMisba.appendChild(li); });
      right.forEach(t=>{ const li=document.createElement('li'); li.className='item'; li.innerHTML=itemHTML(t,'green'); el.laneSakti.appendChild(li); });
    }

    async function load(){
      try{
        const r=await fetch(API_URL,{cache:'no-store'});
        if(!r.ok) throw new Error('HTTP '+r.status);
        const data=await r.json();
        renderStatus(data);
        renderLanes(data);
        el.updated.textContent='Diperbarui: '+new Date().toLocaleString('id-ID');
      }catch(e){
        el.who.textContent='Gagal memuat'; el.amount.textContent='—';
        el.subtitle.textContent=e.message||'Terjadi kesalahan.'; console.error(e);
      }
    }
    document.addEventListener('DOMContentLoaded', load);
    // setInterval(load, 15000); // aktifkan jika perlu auto-refresh
  </script>
</body>
</html>
